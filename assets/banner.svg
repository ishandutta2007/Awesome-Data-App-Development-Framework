ps</text><g><g transform="translate(60, 185) translate(0, 0)"><rect width="160" height="38" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="18" y="24" fill="#38bdf8" class="title-font" font-size="14">🐍 Python Apps</text></g><g transform="translate(60, 185) translate(175, 0)"><rect width="180" height="38" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="18" y="24" fill="#818cf8" class="title-font" font-size="14">🛠️ Low-Code / Internal</text></g><g transform="translate(60, 185) translate(370, 0)"><rect width="170" height="38" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="18" y="24" fill="#c084fc" class="title-font" font-size="14">📊 Dashboards &amp; BI</text></g><g transform="translate(60, 185) translate(555, 0)"><rect width="150" height="38" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="18" y="24" fill="#34d399" class="title-font" font-size="14">🔒 Self-Hosted</text></g></g><g transform="translate(60, 252)"><text x="0" y="0" fill="#64748b" class="code-text" font-size="12">⭐ Community Curated</text><circle cx="150" cy="-4" r="2" fill="#475569"/><text x="165" y="0" fill="#64748b" class="code-text" font-size="12">🚀 Production Proven</text><circle cx="310" cy="-4" r="2" fill="#475569"/><text x="325" y="0" fill="#64748b" class="code-text" font-size="12">🌐 SaaS &amp; Open Source</text></g></g></svg>